<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrimonio di Federica & Stefano</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121212;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Contenitore principale a scorrimento stile smartphone */
    .invitation-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none; /* Firefox */
      position: relative;
    }

    .invitation-container::-webkit-scrollbar {
      display: none; /* Chrome, Safari */
    }

    /* Card per ciascuna immagine */
    .page-card {
      position: relative;
      width: 100%;
      height: 100vh;
      scroll-snap-align: start;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .page-card img.bg-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Hotspot trasparente per i clic */
    .hotspot {
      position: absolute;
      cursor: pointer;
      text-decoration: none;
      z-index: 5;
    }

    /* 1. Pulsante "Entra nella partecipazione" */
    #btn-enter {
      bottom: 8%;
      left: 10%;
      width: 80%;
      height: 8%;
      border-radius: 25px;
    }

    /* 2. Link Mappa Chiesa */
    #btn-church-map {
      bottom: 8%;
      left: 10%;
      width: 80%;
      height: 14%;
      border-radius: 15px;
    }

    /* 3. Link Mappa Villa */
    #btn-villa-map {
      bottom: 10%;
      left: 10%;
      width: 80%;
      height: 15%;
      border-radius: 15px;
    }

    /* 4. Pulsanti RSVP */
    .rsvp-option {
      left: 15%;
      width: 70%;
      height: 6%;
      border-radius: 10px;
    }

    #btn-yes {
      top: 58%;
    }

    #btn-no {
      top: 65%;
    }

    /* Solo Icona di Geolocalizzazione Dorata */
    .geo-pin {
      position: absolute;
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #d4af37;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      pointer-events: none;
      animation: pulse-pin 2s infinite;
    }

    .geo-pin svg {
      width: 18px;
      height: 18px;
      fill: #b8860b;
    }

    @keyframes pulse-pin {
      0% { transform: scale(1); box-shadow: 0 0 4px rgba(212, 175, 55, 0.4); }
      50% { transform: scale(1.15); box-shadow: 0 0 12px rgba(212, 175, 55, 0.8); }
      100% { transform: scale(1); box-shadow: 0 0 4px rgba(212, 175, 55, 0.4); }
    }

    /* MODIFICHE POSIZIONE ICONE GEOLOCALIZZAZIONE */
    #pin-church {
      bottom: 15.8%; /* Alzata rispetto a prima */
      left: 12%;
    }

    #pin-villa {
      bottom: 15.8%; /* Alzata rispetto a prima */
      left: 20%;   /* Spostata più a sinistra rispetto a prima */
    }

    /* Freccia dorata animata alzata per Android */
    .scroll-arrow-br {
      position: absolute;
      bottom: 70px;
      right: 25px;
      z-index: 10;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(212, 175, 55, 0.9);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
    }

    .scroll-arrow-br svg {
      width: 24px;
      height: 24px;
      fill: #5c4716;
      animation: bounce-arrow 1.8s infinite;
    }

    @keyframes bounce-arrow {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-6px);
      }
      60% {
        transform: translateY(-3px);
      }
    }
  </style>
</head>
<body>

  <div class="invitation-container" id="invitation">

    <!-- PAGE 01: Copertina -->
    <div class="page-card" id="page-01">
      <img src="01.png" class="bg-img" alt="Copertina">
      <a href="#page-02" class="hotspot" id="btn-enter" title="Entra nella partecipazione"></a>
      
      <a href="#page-02" class="scroll-arrow-br" title="Scorri alla pagina successiva">
        <svg viewBox="0 0 24 24">
          <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/>
        </svg>
      </a>
    </div>

    <!-- PAGE 02: Cerimonia -->
    <div class="page-card" id="page-02">
      <img src="02.png" class="bg-img" alt="Cerimonia - Chiesa">
      
      <div class="geo-pin" id="pin-church">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
        </svg>
      </div>

      <a href="https://maps.google.com/?q=Piazzale+dei+Santi+Pietro+e+Paolo+EUR+Roma" 
         target="_blank" 
         class="hotspot" 
         id="btn-church-map" 
         title="Apri indicazioni Google Maps"></a>

      <a href="#page-03" class="scroll-arrow-br" title="Scorri alla pagina successiva">
        <svg viewBox="0 0 24 24">
          <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/>
        </svg>
      </a>
    </div>

    <!-- PAGE 03: Ricevimento -->
    <div class="page-card" id="page-03">
      <img src="03.png" class="bg-img" alt="Ricevimento - Villa delle Rose">
      
      <div class="geo-pin" id="pin-villa">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5-2.5-1.12 2.5-2.5 2.5z"/>
        </svg>
      </div>

      <a href="https://maps.google.com/?q=Villa+delle+Rose+Trigoria+Roma" 
         target="_blank" 
         class="hotspot" 
         id="btn-villa-map" 
         title="Apri indicazioni Google Maps"></a>

      <a href="#page-04" class="scroll-arrow-br" title="Scorri alla pagina successiva">
        <svg viewBox="0 0 24 24">
          <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/>
        </svg>
      </a>
    </div>

    <!-- PAGE 04: RSVP -->
    <div class="page-card" id="page-04">
      <img src="04.png" class="bg-img" alt="Conferma Presenza">
      
      <a href="https://wa.me/393331234567?text=Ciao!%20Confermo%20con%20piacere%20la%20mia%20presenza%20al%20vostro%20matrimonio!" 
         target="_blank" 
         class="hotspot rsvp-option" 
         id="btn-yes" 
         title="Parteciperò"></a>

      <a href="https://wa.me/393331234567?text=Ciao!%20Purtroppo%20non%20potrò%20partecipare%20al%20vostro%20matrimonio." 
         target="_blank" 
         class="hotspot rsvp-option" 
         id="btn-no" 
         title="Non potrò partecipare"></a>
    </div>

  </div>

</body>
</html>
